<header class="w-full border-b border-gray-200 bg-white">
        <div class="mx-auto flex h-[76px] max-w-[1200px] items-center justify-between px-4 sm:px-6">
          <a href="#sec-hero" class="flex h-9 items-center gap-1.5 rounded border border-gray-400 px-2" aria-label="풀무원 홈으로 이동">
            <svg class="h-[18px] w-[18px] text-brand" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M16 4C9 4 4 9 4 16c8 0 12-4 12-12Z" />
              <path d="M5.2 15.4 15 5.6" stroke="white" stroke-width="1" stroke-linecap="round" />
            </svg>
            <span class="text-sm font-bold text-brand">풀무원</span>
          </a>

          <nav aria-label="주요 메뉴" class="hidden md:block">
            <ul class="flex gap-6 text-sm text-gray-600">
              <li><a class="nav-link py-2" href="#sec-hero">회사소개</a></li>
              <li><a class="nav-link py-2" href="#sec-footprint">사회책임경영</a></li>
              <li><a class="nav-link py-2" href="#sec-ecocaring">바른먹거리</a></li>
              <li><a class="nav-link py-2" href="#sec-earthdiet-products">지구식단</a></li>
              <li><a class="nav-link py-2" href="#sec-newsroom">뉴스룸</a></li>
            </ul>
          </nav>

          <div class="flex items-center gap-2 sm:gap-4">
            <div class="relative hidden sm:block">
              <button id="search-btn" type="button" aria-expanded="false" aria-controls="search-panel"
                class="flex items-center gap-2 rounded-lg border border-gray-400 px-3 py-2 text-sm text-gray-600 transition hover:border-brand hover:text-brand focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">
                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                  <circle cx="9" cy="9" r="6" />
                  <path d="m17 17-4-4" stroke-linecap="round" />
                </svg>
                검색
              </button>
              <div id="search-panel" class="hidden absolute right-0 top-[calc(100%+8px)] w-72 rounded-xl border border-gray-200 bg-white p-3 shadow-lg">
                <label for="search-input" class="sr-only">검색어 입력</label>
                <input id="search-input" type="search" placeholder="궁금한 내용을 검색해보세요"
                  class="w-full rounded-lg border border-gray-400 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30" />
              </div>
            </div>

            <div class="relative">
              <button id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
                class="flex items-center gap-1 rounded-2xl bg-gray-100 px-3 py-2 text-sm text-gray-600 transition hover:bg-gray-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" />
                </svg>
                <span>KOR</span>
                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <path fill-rule="evenodd" d="M5.2 7.2a.9.9 0 0 1 1.27 0L10 10.72l3.53-3.52a.9.9 0 1 1 1.27 1.27l-4.16 4.17a.9.9 0 0 1-1.28 0L5.2 8.47a.9.9 0 0 1 0-1.27Z" clip-rule="evenodd" />
                </svg>
              </button>
              <ul id="lang-menu" role="listbox" aria-label="언어 선택"
                class="hidden absolute right-0 top-[calc(100%+8px)] w-28 overflow-hidden rounded-xl border border-gray-200 bg-white py-1 text-sm shadow-lg">
                <li role="option" aria-selected="true"><button type="button" class="block w-full px-3 py-2 text-left font-bold text-gray-900 hover:bg-gray-50">한국어</button></li>
                <li role="option" aria-selected="false"><button type="button" class="block w-full px-3 py-2 text-left text-gray-500 hover:bg-gray-50">English</button></li>
              </ul>
            </div>

            <button id="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu"
              class="rounded-lg border border-gray-400 p-2 text-gray-600 md:hidden">
              <svg id="menu-icon-open" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
              <svg id="menu-icon-close" class="hidden h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </div>
        </div>

        <div id="mobile-menu" class="hidden border-t border-gray-200 bg-white px-4 py-4 md:hidden">
          <ul class="flex flex-col gap-1 text-sm text-gray-700">
            <li><a class="block rounded-lg px-2 py-2.5 hover:bg-gray-50" href="#sec-hero">회사소개</a></li>
            <li><a class="block rounded-lg px-2 py-2.5 hover:bg-gray-50" href="#sec-footprint">사회책임경영</a></li>
            <li><a class="block rounded-lg px-2 py-2.5 hover:bg-gray-50" href="#sec-ecocaring">바른먹거리</a></li>
            <li><a class="block rounded-lg px-2 py-2.5 hover:bg-gray-50" href="#sec-earthdiet-products">지구식단</a></li>
            <li><a class="block rounded-lg px-2 py-2.5 hover:bg-gray-50" href="#sec-newsroom">뉴스룸</a></li>
          </ul>
        </div>
      </header>
